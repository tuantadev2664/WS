<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Sound - Mini Battleship</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 Debug Sound System</h1>
        
        <div>
            <button onclick="testWebAudio()">Test Web Audio</button>
            <button onclick="testFileAudio()">Test File Audio</button>
            <button onclick="testAllSounds()">Test All Sounds</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>
        
        <div id="log" class="log"></div>
        
        <div>
            <h3>📋 Instructions:</h3>
            <ul>
                <li>Click "Test Web Audio" để test Web Audio API</li>
                <li>Click "Test File Audio" để test file âm thanh</li>
                <li>Click "Test All Sounds" để test tất cả âm thanh</li>
                <li>Kiểm tra console và log để debug</li>
            </ul>
        </div>
    </div>

    <script>
        let logElement = document.getElementById('log');
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            console.log(message);
        }
        
        function clearLog() {
            logElement.textContent = '';
        }
        
        // Test Web Audio
        function testWebAudio() {
            log('Testing Web Audio API...');
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                log(`Audio context state: ${audioContext.state}`);
                
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        log('Audio context resumed');
                        playTestSound(audioContext);
                    });
                } else {
                    playTestSound(audioContext);
                }
            } catch (error) {
                log(`Web Audio error: ${error.message}`);
            }
        }
        
        function playTestSound(audioContext) {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
            
            log('Web Audio test sound played');
        }
        
        // Test File Audio
        function testFileAudio() {
            log('Testing file audio...');
            const audioFiles = [
                '/sounds/hit.mp3',
                '/sounds/hit.wav',
                '/sounds/hit.ogg',
                '/sounds/miss.mp3',
                '/sounds/miss.wav',
                '/sounds/miss.ogg'
            ];
            
            let found = false;
            for (let file of audioFiles) {
                try {
                    const audio = new Audio(file);
                    audio.volume = 0.7;
                    
                    audio.addEventListener('canplaythrough', () => {
                        log(`Audio file ready: ${file}`);
                    });
                    
                    audio.addEventListener('error', (e) => {
                        log(`Audio file error: ${file} - ${e.message}`);
                    });
                    
                    audio.play().then(() => {
                        log(`Successfully played: ${file}`);
                        found = true;
                    }).catch(e => {
                        log(`Could not play: ${file} - ${e.message}`);
                    });
                    
                    if (found) break;
                } catch (error) {
                    log(`Error with ${file}: ${error.message}`);
                }
            }
            
            if (!found) {
                log('No audio files found, using Web Audio fallback');
                testWebAudio();
            }
        }
        
        // Test All Sounds
        function testAllSounds() {
            log('Testing all sound types...');
            
            const soundTypes = ['fire', 'hit', 'miss', 'win'];
            let index = 0;
            
            function playNext() {
                if (index < soundTypes.length) {
                    log(`Playing ${soundTypes[index]} sound...`);
                    playSound(soundTypes[index]);
                    index++;
                    setTimeout(playNext, 1000);
                } else {
                    log('All sounds tested');
                }
            }
            
            playNext();
        }
        
        // Sound system (same as game.js)
        const playSound = (soundType) => {
            log(`Attempting to play ${soundType} sound...`);
            
            const audioFiles = {
                'hit': ['/sounds/hit.mp3', '/sounds/hit.wav', '/sounds/hit.ogg'],
                'miss': ['/sounds/miss.mp3', '/sounds/miss.wav', '/sounds/miss.ogg'],
                'win': ['/sounds/win.mp3', '/sounds/win.wav', '/sounds/win.ogg'],
                'fire': ['/sounds/fire.mp3', '/sounds/fire.wav', '/sounds/fire.ogg']
            };
            
            const files = audioFiles[soundType];
            if (files) {
                const played = playAudioFile(files);
                if (played) {
                    log(`Successfully played ${soundType} from audio file`);
                    return;
                }
            }
            
            log(`Using Web Audio fallback for ${soundType}`);
            playWebAudioSound(soundType);
        };
        
        const playAudioFile = (audioFiles) => {
            let played = false;
            
            for (let i = 0; i < audioFiles.length; i++) {
                try {
                    const audio = new Audio(audioFiles[i]);
                    audio.volume = 0.7;
                    audio.preload = 'auto';
                    
                    audio.addEventListener('canplaythrough', () => {
                        log(`Audio file ${audioFiles[i]} is ready to play`);
                    });
                    
                    audio.addEventListener('error', (e) => {
                        log(`Error with ${audioFiles[i]}: ${e.message}`);
                    });
                    
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            log(`Successfully playing ${audioFiles[i]}`);
                            played = true;
                        }).catch(e => {
                            log(`Could not play ${audioFiles[i]}: ${e.message}`);
                        });
                    }
                    
                    if (played) break;
                } catch (e) {
                    log(`Error loading ${audioFiles[i]}: ${e.message}`);
                }
            }
            
            if (!played) {
                log('No audio files found, using Web Audio fallback');
                return false;
            }
            return true;
        };
        
        const playWebAudioSound = (soundType) => {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        log('Audio context resumed');
                    });
                }
                
                switch(soundType) {
                    case 'hit':
                        const hitOscillator = audioContext.createOscillator();
                        const hitGain = audioContext.createGain();
                        hitOscillator.connect(hitGain);
                        hitGain.connect(audioContext.destination);
                        hitOscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                        hitOscillator.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.4);
                        hitGain.gain.setValueAtTime(0.4, audioContext.currentTime);
                        hitGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                        hitOscillator.start(audioContext.currentTime);
                        hitOscillator.stop(audioContext.currentTime + 0.4);
                        log('Web Audio hit sound played');
                        break;
                        
                    case 'miss':
                        const missOscillator = audioContext.createOscillator();
                        const missGain = audioContext.createGain();
                        missOscillator.connect(missGain);
                        missGain.connect(audioContext.destination);
                        missOscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
                        missOscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);
                        missGain.gain.setValueAtTime(0.3, audioContext.currentTime);
                        missGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        missOscillator.start(audioContext.currentTime);
                        missOscillator.stop(audioContext.currentTime + 0.3);
                        log('Web Audio miss sound played');
                        break;
                        
                    case 'fire':
                        const fireOscillator = audioContext.createOscillator();
                        const fireGain = audioContext.createGain();
                        fireOscillator.connect(fireGain);
                        fireGain.connect(audioContext.destination);
                        fireOscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                        fireOscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
                        fireGain.gain.setValueAtTime(0.2, audioContext.currentTime);
                        fireGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                        fireOscillator.start(audioContext.currentTime);
                        fireOscillator.stop(audioContext.currentTime + 0.1);
                        log('Web Audio fire sound played');
                        break;
                        
                    case 'win':
                        const winOscillator1 = audioContext.createOscillator();
                        const winOscillator2 = audioContext.createOscillator();
                        const winGain = audioContext.createGain();
                        winOscillator1.connect(winGain);
                        winOscillator2.connect(winGain);
                        winGain.connect(audioContext.destination);
                        winOscillator1.frequency.setValueAtTime(523, audioContext.currentTime);
                        winOscillator2.frequency.setValueAtTime(659, audioContext.currentTime);
                        winGain.gain.setValueAtTime(0.3, audioContext.currentTime);
                        winGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.0);
                        winOscillator1.start(audioContext.currentTime);
                        winOscillator2.start(audioContext.currentTime);
                        winOscillator1.stop(audioContext.currentTime + 1.0);
                        winOscillator2.stop(audioContext.currentTime + 1.0);
                        log('Web Audio win sound played');
                        break;
                }
            } catch (error) {
                log(`Error playing Web Audio sound: ${error.message}`);
            }
        };
        
        // Initialize on page load
        log('Sound debug page loaded');
        log('Click buttons to test different sound systems');
    </script>
</body>
</html>
